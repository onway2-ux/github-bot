<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Email Outreach Bot - v2.5 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        [v-cloak] { display: none; }
        .hidden { display: none; }
        #editor-container { height: 300px; }
        .ql-editor { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Auth Section -->
        <div id="auth-container" class="flex flex-col items-center justify-center min-h-[80vh]">
            <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
                <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Email Bot Login</h1>
                
                <div id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="auth-email" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-3" placeholder="admin@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="auth-password" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-3" placeholder="••••••••">
                    </div>
                    <div class="flex flex-col space-y-3 pt-2">
                        <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">Login</button>
                    </div>
                    <p id="auth-error" class="text-red-500 text-sm mt-2 hidden text-center"></p>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-container" class="hidden">
            <header class="flex justify-between items-center mb-8 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Outreach Dashboard</h1>
                    <p id="user-display" class="text-sm text-gray-500 font-medium"></p>
                </div>
                <button id="logout-btn" class="bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 px-4 py-2 rounded-lg font-medium transition border border-gray-200">Logout</button>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Sidebar -->
                <div class="lg:col-span-1 space-y-6">
                    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center">
                            <span class="mr-2">⚙️</span> Configuration
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">GitHub Repo (user/repo)</label>
                                <input type="text" id="gh-repo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="username/repo-name">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">GitHub PAT</label>
                                <input type="password" id="gh-pat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                                <div class="mt-2 flex items-center">
                                    <input type="checkbox" id="remember-pat" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                    <label for="remember-pat" class="ml-2 text-xs text-gray-600">Remember token in this browser</label>
                                </div>
                            </div>
                            <button id="save-config" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition">Save Configuration</button>
                        </div>
                    </section>

                    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center">
                            <span class="mr-2">📈</span> Campaign Settings
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Sender Display Name</label>
                                <input type="text" id="sender-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700">Subject Line</label>
                                <input type="text" id="email-subject" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Delay (seconds)</label>
                                <input type="number" id="email-delay" value="30" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                            </div>
                            <button id="trigger-workflow" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center">
                                <span id="btn-text">🚀 Send Campaign</span>
                                <svg id="btn-loader" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            </button>
                        </div>
                    </section>
                </div>

                <!-- Main Content -->
                <div class="lg:col-span-2 space-y-6">
                    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center">
                            <span class="mr-2">📝</span> Word Processor
                        </h2>
                        <p class="text-xs text-gray-500 mb-2 italic">Use {{name}} for personalization.</p>
                        <div id="editor-container"></div>
                    </section>

                    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <h2 class="text-lg font-semibold flex items-center">
                                <span class="mr-2">👥</span> Prospects
                            </h2>
                            <div class="flex space-x-2">
                                <button id="reset-status-btn" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1 rounded-lg font-semibold text-sm transition border border-amber-100">Reset Status</button>
                                <button id="add-prospect-modal-btn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg font-semibold text-sm transition border border-indigo-100">+ Add Bulk</button>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="prospects-list" class="bg-white divide-y divide-gray-200"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Add Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-2xl mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Add Bulk Prospects</h3>
                <button id="add-row-btn" class="text-indigo-600 hover:text-indigo-800 text-sm font-bold">+ Add Slot</button>
            </div>
            <div id="bulk-rows-container" class="max-h-[50vh] overflow-y-auto space-y-3 mb-6 p-2"></div>
            <div class="flex justify-end space-x-3 pt-4 border-t">
                <button id="close-modal" class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">Cancel</button>
                <button id="save-bulk-prospects" class="bg-indigo-600 px-6 py-2 rounded-lg text-white font-bold hover:bg-indigo-700 transition">Save All</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpKrYYfa_bzxSUc0qzwIMEymfG8bokIc0",
            authDomain: "githubemail-s.firebaseapp.com",
            databaseURL: "https://githubemail-s-default-rtdb.firebaseio.com",
            projectId: "githubemail-s",
            storageBucket: "githubemail-s.firebasestorage.app",
            messagingSenderId: "737852994781",
            appId: "1:737852994781:web:1adc9eb499e4d4301e1734"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- Editor Setup ---
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Hi {{name}},<br><br>I would love to connect...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'clean']
                ]
            }
        });

        // --- State ---
        let currentUser = null;
        let config = {
            ghRepo: 'onway2-ux/github-bot',
            ghPat: localStorage.getItem('ghPat') || ''
        };

        // --- Elements ---
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const authEmail = document.getElementById('auth-email');
        const authPass = document.getElementById('auth-password');
        const loginBtn = document.getElementById('login-btn');
        const authError = document.getElementById('auth-error');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');
        const ghRepoInput = document.getElementById('gh-repo');
        const ghPatInput = document.getElementById('gh-pat');
        const rememberPatCheck = document.getElementById('remember-pat');
        const saveConfigBtn = document.getElementById('save-config');
        const triggerBtn = document.getElementById('trigger-workflow');
        const prospectsList = document.getElementById('prospects-list');
        const subjectInput = document.getElementById('email-subject');
        const senderNameInput = document.getElementById('sender-name');
        const delayInput = document.getElementById('email-delay');
        const resetStatusBtn = document.getElementById('reset-status-btn');

        // --- Auth ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userDisplay.textContent = `User: ${user.email}`;
                loadDashboard();
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });

        loginBtn.onclick = async () => {
            try {
                authError.classList.add('hidden');
                await signInWithEmailAndPassword(auth, authEmail.value, authPass.value);
            } catch (e) {
                authError.textContent = e.message;
                authError.classList.remove('hidden');
            }
        };

        logoutBtn.onclick = () => signOut(auth);

        // --- Dashboard ---
        function loadDashboard() {
            ghRepoInput.value = config.ghRepo;
            ghPatInput.value = config.ghPat;
            rememberPatCheck.checked = !!localStorage.getItem('ghPat');

            onValue(ref(db, 'campaign'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    senderNameInput.value = data.senderName || '';
                    subjectInput.value = data.subject || '';
                    delayInput.value = data.delay || 30;
                    quill.root.innerHTML = data.template || '';
                }
            });

            onValue(ref(db, 'prospects'), (snapshot) => renderProspects(snapshot.val()));
        }

        function renderProspects(prospects) {
            prospectsList.innerHTML = '';
            if (!prospects) return;
            Object.keys(prospects).forEach(id => {
                const p = prospects[id];
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition";
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${p.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full ${p.status === 'sent' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                            ${p.status || 'pending'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button class="text-red-500 hover:text-red-700 font-bold delete-btn" data-id="${id}">Remove</button>
                    </td>
                `;
                prospectsList.appendChild(row);
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => { if(confirm('Remove?')) remove(ref(db, `prospects/${btn.dataset.id}`)); };
            });
        }

        // --- Config Actions ---
        saveConfigBtn.onclick = () => {
            config.ghRepo = ghRepoInput.value;
            config.ghPat = ghPatInput.value;
            if (rememberPatCheck.checked) localStorage.setItem('ghPat', config.ghPat);
            else localStorage.removeItem('ghPat');
            alert('Settings saved!');
        };

        // --- Campaign Updates ---
        const updateCampaign = () => {
            update(ref(db, 'campaign'), {
                senderName: senderNameInput.value,
                subject: subjectInput.value,
                delay: delayInput.value,
                template: quill.root.innerHTML
            });
        };

        [subjectInput, delayInput, senderNameInput].forEach(el => el.onblur = updateCampaign);
        quill.on('text-change', () => {
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(updateCampaign, 1000);
        });

        resetStatusBtn.onclick = async () => {
            if(!confirm('Reset all to pending?')) return;
            const snapshot = await get(ref(db, 'prospects'));
            const data = snapshot.val();
            if(!data) return;
            const updates = {};
            Object.keys(data).forEach(id => updates[`prospects/${id}/status`] = 'pending');
            await update(ref(db), updates);
            alert('All prospects reset!');
        };

        // --- Bulk Add Modal ---
        const addModal = document.getElementById('add-modal');
        const bulkContainer = document.getElementById('bulk-rows-container');
        document.getElementById('add-prospect-modal-btn').onclick = () => {
            bulkContainer.innerHTML = '';
            for(let i=0; i<5; i++) addBulkRow();
            addModal.classList.remove('hidden');
        };

        function addBulkRow() {
            const div = document.createElement('div');
            div.className = "flex space-x-2 bulk-row";
            div.innerHTML = `<input type="text" placeholder="Name" class="w-1/2 border p-2 rounded-lg"><input type="email" placeholder="Email" class="w-1/2 border p-2 rounded-lg">`;
            bulkContainer.appendChild(div);
        }
        document.getElementById('add-row-btn').onclick = addBulkRow;
        document.getElementById('close-modal').onclick = () => addModal.classList.add('hidden');
        document.getElementById('save-bulk-prospects').onclick = async () => {
            const rows = document.querySelectorAll('.bulk-row');
            let count = 0;
            for(let row of rows) {
                const name = row.children[0].value.trim();
                const email = row.children[1].value.trim();
                if(name && email) {
                    await push(ref(db, 'prospects'), { name, email, status: 'pending' });
                    count++;
                }
            }
            if(count > 0) { addModal.classList.add('hidden'); alert(`Added ${count}!`); }
        };

        // --- Workflow ---
        triggerBtn.onclick = async () => {
            if (!config.ghRepo || !config.ghPat) return alert('Check GitHub Settings!');
            setLoading(true);
            try {
                const res = await fetch(`https://api.github.com/repos/${config.ghRepo}/actions/workflows/email-bot.yml/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${config.ghPat}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (res.ok) alert('Started!'); else alert('Error: ' + (await res.json()).message);
            } catch (e) { alert(e.message); } finally { setLoading(false); }
        };

        function setLoading(loading) {
            triggerBtn.disabled = loading;
            document.getElementById('btn-text').textContent = loading ? 'Starting...' : '🚀 Send Campaign';
            document.getElementById('btn-loader').classList.toggle('hidden', !loading);
            triggerBtn.classList.toggle('opacity-50', loading);
        }
    </script>
</body>
</html>
